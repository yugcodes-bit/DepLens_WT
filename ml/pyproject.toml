[project]
name = "deplens-ml"
version = "0.1.0"
description = "DepLens: dataset, models, evaluation and inference service"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "pyarrow>=16",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "lightgbm>=4.5",
  "xgboost>=2.1",
  "optuna>=4.0",
  "shap>=0.46",
  "scipy>=1.13",
  "statsmodels>=0.14",
  "matplotlib>=3.9",
  "fastapi>=0.115",
  "pydantic>=2.8",
  "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 110
